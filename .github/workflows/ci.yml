name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # `prisma generate` only needs a syntactically valid URL, it never connects.
  DATABASE_URL: postgresql://vexlyx:placeholder@localhost:5432/vexlyx_dev

jobs:
  mail-credential-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vexlyx-dovecot:credentials-test docker/dovecot
      - run: docker build -t vexlyx-postfix:credentials-test docker/postfix
      - run: python3 -m unittest tests.test_mail_credential_security tests.test_mail_credential_protocols -v
      - run: python3 -m unittest tests.test_roundcube_tls -v
      - run: python3 -m unittest tests.test_mail_state_mounts -v
      - name: Fail if the tests left the working tree dirty
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::The test run changed tracked or untracked files. Runtime state must live in ignored paths."
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vexlyx/api db:generate
      # turbo builds @vexlyx/shared first (typecheck dependsOn ^build).
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vexlyx/api db:generate
      - run: pnpm test
      - run: python3 -m unittest discover -s tests -p test_restore_stop_safety.py
      - run: python3 -m unittest discover -s tests -p test_git_url_policy.py
      - run: python3 -m unittest discover -s tests -p test_installer_release_channel.py
      - run: python3 -m unittest discover -s tests -p test_installer_nixpacks.py
      - run: python3 -m unittest discover -s tests -p test_installer_mail_state_migration.py
      - run: python3 -m unittest discover -s tests -p test_mail_state_untracked.py
      - run: python3 -m unittest discover -s tests -p test_postfix_map_rebuild.py
      - run: python3 -m unittest discover -s tests -p test_opendkim_reload.py
      - name: Fail if the tests left the working tree dirty
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::The test run changed tracked or untracked files. Runtime state must live in ignored paths."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: apps/dashboard/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/dashboard/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vexlyx/api db:generate
      - run: pnpm build
